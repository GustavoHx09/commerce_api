services:
  mongo:
    image: mongo:6
    platform: linux/amd64
    container_name: commerce_mongo
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', 'localhost:27017', '--eval', 'db.adminCommand("ping")', '--quiet']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:6
    platform: linux/amd64
    container_name: commerce_mongo_init
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    command: >
      mongosh mongodb://mongo:27017 --eval
      "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"

volumes:
  mongo_data:
